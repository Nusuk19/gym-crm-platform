services:
  postgres:
    image: postgres:16-alpine
    container_name: gym-postgres
    environment:
      POSTGRES_DB: gym
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym
    ports:
      - "5432:5432"
    volumes:
      - gym-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U gym -d gym" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gym-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: gym-mongo
    ports:
      - "27017:27017"
    volumes:
      - gym-mongo-data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 5s
      retries: 10

  activemq:
    image: apache/activemq-classic:latest
    container_name: gym-activemq
    ports:
      - "61616:61616" # OpenWire (app connections)
      - "8161:8161"   # Web console
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8161/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  gym-postgres-data:
  gym-mongo-data:
