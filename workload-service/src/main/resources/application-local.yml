spring:
  activemq:
    broker-url: tcp://localhost:61616
    user: gym-crm
    password: gym-crm
  data:
    redis:
      host: localhost
      port: 6379
    mongodb:
      uri: mongodb://localhost:27017/workload-db

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: local-dev-secret-key-local-dev-secret-key

logging:
  level:
    com.gym.crm: DEBUG

app:
  jms:
    consumer:
      concurrency: 1-3