spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/gym_dev
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
    activemq:
      broker-url: ${ACTIVEMQ_BROKER_URL}
      user: ${ACTIVEMQ_USER}
      password: ${ACTIVEMQ_PASSWORD}

logging:
  level:
    root: INFO
    org.springframework: INFO
    com.gym.crm: DEBUG