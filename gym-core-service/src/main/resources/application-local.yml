spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/gym
    username: gym
    password: gym
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.gym.crm: DEBUG
    org.hibernate.SQL: DEBUG

workload:
  service:
    base-url: http://localhost:8082/workload-service/api/v1